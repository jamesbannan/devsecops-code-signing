# =============================================================================
# values-aks.yaml — Azure Kubernetes Service overrides
# =============================================================================
# Usage:
#   helm upgrade --install devsecops-demo chart/ \
#     -f chart/values-aks.yaml \
#     --set global.registry=<YOUR_ACR>.azurecr.io \
#     --wait --timeout 15m
#
# Prerequisites:
#   - AKS cluster with OIDC issuer enabled:
#       az aks update --enable-oidc-issuer -n <cluster> -g <rg>
#   - Azure Container Registry (ACR) attached to the cluster:
#       az aks update --attach-acr <acr-name> -n <cluster> -g <rg>
#   - The OIDC issuer URL must be configured in scaffold.fulcio values below.
#     Find it with: az aks show -n <cluster> -g <rg> --query "oidcIssuerProfile.issuerUrl"
# =============================================================================

global:
  environment: aks
  # Replace with your ACR login server, e.g. myacr.azurecr.io
  registry: "<YOUR_ACR_NAME>.azurecr.io"
  imagePullPolicy: Always

# Registry: use ClusterIP + Azure-managed ingress instead of NodePort
registry:
  service:
    type: ClusterIP
    # nodePort is ignored when type is ClusterIP
  storage:
    # Azure managed disks (default storage class on AKS)
    storageClassName: "managed-csi"
    size: 5Gi

# Demo UIs: ClusterIP on AKS (service type auto-switches via global.environment,
# these blocks are explicit for clarity). Reach them with kubectl port-forward:
#   kubectl port-forward svc/registry-ui 30800:80   -n registry
#   kubectl port-forward svc/rekor-ui    30900:8080 -n registry
# registry-ui uses the public joxit image (no build needed). rekor-ui is the
# custom image built by demos/rekor-ui/build-and-push.sh; its repository defaults
# to "<global.registry>/demo/rekor-ui", i.e. your ACR — no override needed below.
registryUi:
  service:
    type: ClusterIP
rekorUi:
  service:
    type: ClusterIP
  # image.repository defaults to "<global.registry>/demo/rekor-ui" (your ACR).
  # Uncomment to pin an explicit path:
  # image:
  #   repository: "<YOUR_ACR_NAME>.azurecr.io/demo/rekor-ui"

# Sigstore OIDC issuer for AKS — update to your cluster's OIDC issuer URL.
# The Sigstore Scaffolding Fulcio sub-chart consumes the full config blob via
# `.config.contents`. We override it here to add the AKS-managed OIDC issuer
# alongside the in-cluster issuer that backs the chart's built-in signing jobs.
scaffold:
  fulcio:
    config:
      contents:
        OIDCIssuers:
          # Replace <OIDC_ISSUER_URL> with the output of:
          #   az aks show -n <cluster> -g <rg> --query "oidcIssuerProfile.issuerUrl"
          "<OIDC_ISSUER_URL>":
            IssuerURL: "<OIDC_ISSUER_URL>"
            ClientID: "sigstore"
            Type: "kubernetes"
          "https://kubernetes.default.svc":
            IssuerURL: "https://kubernetes.default.svc"
            ClientID: "sigstore"
            Type: "kubernetes"
        MetaIssuers:
          "https://kubernetes.*.svc":
            ClientID: "sigstore"
            Type: "kubernetes"

# Demo app image reference — use ACR path
workload:
  demoApp:
    # Replace with your ACR login server
    image: "<YOUR_ACR_NAME>.azurecr.io/demo/app"
    tag: latest

# Disable NodePort-based host access — use kubectl port-forward or ingress instead
hostAccess:
  enabled: false

# Optional: add ingress annotations for AKS Application Gateway or nginx ingress
# Uncomment and configure as needed:
# ingress:
#   enabled: true
#   className: azure-application-gateway  # or nginx
#   annotations:
#     kubernetes.io/ingress.class: azure/application-gateway
