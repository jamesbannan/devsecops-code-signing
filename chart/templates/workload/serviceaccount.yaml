{{- if .Values.workload.enabled }}
---
# ServiceAccount for signing jobs (Smallstep + Sigstore paths).
# The signing-sa is bound to RBAC allowing it to read the step-ca-root ConfigMap
# in the pki namespace (via ClusterRole in rbac.yaml).
# It also receives projected ServiceAccount tokens for Sigstore keyless signing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signing-sa
  namespace: {{ include "devsecops-demo.workloadNamespace" . }}
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-signing

---
# ServiceAccount for the verification job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-sa
  namespace: {{ include "devsecops-demo.workloadNamespace" . }}
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-verification
{{- end }}
