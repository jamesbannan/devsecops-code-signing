{{/*
pki/tuf-copy-secrets.yaml

Copies public keys from Fulcio, Rekor, and CT Log namespaces into the
tuf-system namespace so the TUF deployment can mount them. This replaces
the scaffold chart's copySecretJob which requires TSA to be enabled.
*/}}

{{- if and .Values.sigstore.enabled .Values.scaffold.tuf.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuf-copy-secrets
  namespace: {{ .Values.scaffold.tuf.namespace.name }}
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuf-copy-secrets
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuf-copy-secrets
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: tuf-copy-secrets
    namespace: {{ .Values.scaffold.tuf.namespace.name }}
roleRef:
  kind: ClusterRole
  name: tuf-copy-secrets
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: batch/v1
kind: Job
metadata:
  name: tuf-copy-secrets
  namespace: {{ .Values.scaffold.tuf.namespace.name }}
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuf-copy-secrets
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: tuf-copy-secrets
      restartPolicy: OnFailure
      containers:
        - name: copy-secrets
          image: {{ include "devsecops-demo.kubectlImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              TUF_NS="{{ .Values.scaffold.tuf.namespace.name }}"
              FULCIO_NS="{{ .Values.scaffold.fulcio.namespace.name }}"
              REKOR_NS="{{ .Values.scaffold.rekor.namespace.name }}"
              CTLOG_NS="{{ .Values.scaffold.ctlog.namespace.name }}"

              echo "=== Waiting for Fulcio deployment ==="
              kubectl rollout status deployment fulcio-server -n "$FULCIO_NS" --timeout=300s

              echo "=== Waiting for Rekor deployment ==="
              kubectl rollout status deployment rekor-server -n "$REKOR_NS" --timeout=300s

              echo "=== Waiting for CT Log deployment ==="
              kubectl rollout status deployment ctlog -n "$CTLOG_NS" --timeout=300s

              echo "=== Copying Fulcio secret ==="
              kubectl -n "$FULCIO_NS" get secret fulcio-server-secret -o yaml | \
                sed "s/namespace: .*/namespace: $TUF_NS/" | \
                kubectl apply -f -

              echo "=== Copying CT Log public key ==="
              kubectl -n "$CTLOG_NS" get secret ctlog-public-key -o yaml | \
                sed "s/namespace: .*/namespace: $TUF_NS/" | \
                kubectl apply -f -

              echo "=== Creating Rekor public key ==="
              # Fetch the Rekor public key from the running server (service port 80)
              MAX_WAIT=60
              WAITED=0
              while ! curl -sf "http://rekor-server.$REKOR_NS.svc/api/v1/log/publicKey" -o /tmp/rekor.pub 2>/dev/null; do
                if [ "$WAITED" -ge "$MAX_WAIT" ]; then
                  echo "ERROR: Rekor server not responding after ${MAX_WAIT}s"
                  exit 1
                fi
                sleep 5
                WAITED=$((WAITED + 5))
              done
              kubectl create secret generic rekor-public-key \
                --from-file=key=/tmp/rekor.pub \
                -n "$TUF_NS" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "=== All TUF secrets copied ==="
              kubectl get secrets -n "$TUF_NS"
{{- end }}
