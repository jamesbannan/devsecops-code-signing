{{- if and .Values.kyverno.enabled .Values.workload.enabled }}
---
# cluster-image-policy.yaml — Kyverno ClusterPolicy requiring cosign signatures
# on images deployed into the workload namespace.
#
# Hook weight 5: Kyverno's admission webhook must be registered before this
# ClusterPolicy is applied, otherwise the webhook rejects its own CRDs.
# Weight 5 > default (0) ensures Kyverno pods are ready first.
#
# validationFailureAction defaults to Audit — violations are logged in
# PolicyReports but images are still admitted. Switch to Enforce for Demo 5:
#   kubectl patch clusterpolicy require-image-signature \
#     --type=merge -p '{"spec":{"validationFailureAction":"Enforce"}}'
# Or see demos/demo5-verification/run.sh for the full flow.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
  labels:
    {{- include "devsecops-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
    policies.kyverno.io/title: Require Image Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images deployed into the workload namespace must have a valid cosign
      signature. Accepts signatures from either the Smallstep CA (private PKI)
      or the Sigstore keyless path (Fulcio + Rekor transparency log).
spec:
  validationFailureAction: {{ .Values.workload.policy.validationFailureAction }}
  background: true
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ include "devsecops-demo.workloadNamespace" . }}
      # Exclude the failure-demo jobs themselves — they're expected to deploy
      # unsigned images to demonstrate the policy in action.
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/component: failure-demo
      verifyImages:
        - imageReferences:
            # Match images pushed to the local registry (NodePort or in-cluster DNS)
            - "{{ .Values.global.registry }}/demo/*"
            - "registry.{{ include "devsecops-demo.registryNamespace" . }}.svc*/demo/*"
          mutateDigest: false
          # Require at least one valid attestor from the signing paths
          attestors:
            # Sigstore keyless — validated via Rekor transparency log
            - count: 1
              entries:
                - keyless:
                    rekor:
                      url: http://rekor-server.rekor-system.svc
                    issuer: "https://kubernetes.default.svc"
                    subject: "system:serviceaccount:{{ include "devsecops-demo.workloadNamespace" . }}:signing-sa"
{{- end }}
